name: Auto Generate XHS Scripts

on:
  schedule:
    - cron: '0 18 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 顺便升级到 v4，更稳定
      - name: Set up Python
        uses: actions/setup-python@v5 # 顺便升级到 v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run MiMo Script
        env:
          # 确保这里只有一个冒号，且名字和 Secret 一致
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: python mimo_script.py

      # 关键修改点：升级到 v4
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: xhs-scripts-output
          path: xhs_output.json
