name: Auto Generate XHS Scripts

on:
  schedule:
    - cron: '0 18 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run MiMo Script
        env:
          # 注意：只有一个冒号，后面必须有一个空格
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: python mimo_script.py

      # 这一步能让你在 Actions 页面直接下载生成的文案
      - name: Upload Results
        uses: actions/upload-artifact@v3
        with:
          name: xhs-scripts-output
          path: xhs_output.json
